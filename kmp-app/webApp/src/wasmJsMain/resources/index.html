<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="description" content="Portal de transparência pública — Prefeitura e Câmara Municipal de Canindé, CE.">
    <link rel="canonical" href="https://transparenciacaninde.com.br/">
    <title>Transparência Canindé</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JRKC3S7WK7"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag("js", new Date());
        gtag("config", "G-JRKC3S7WK7", { send_page_view: false, anonymize_ip: true });
    </script>
    <script>
        (function () {
            var path = window.location.pathname || "/";
            if (path.indexOf("/transparencia_caninde") === 0) {
                var tag = document.createElement("base");
                tag.href = "/transparencia_caninde/";
                document.head.appendChild(tag);
            }
        })();
        window.transparenciaShareContent = function (title, text) {
            if (navigator.share) {
                navigator.share({ title: title, text: text }).catch(function () {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text);
                    } else {
                        alert(title + "\n\n" + text);
                    }
                });
            } else if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(function () {
                    alert(title + "\n\n" + text);
                });
            } else {
                alert(title + "\n\n" + text);
            }
        };
        window.transparenciaHideLoading = function () {
            var el = document.getElementById("app-loading");
            if (el) el.style.display = "none";
        };
        window.transparenciaLogScreen = function (screenName) {
            if (typeof gtag === "function" && screenName) {
                gtag("event", "screen_view", {
                    screen_name: screenName,
                    firebase_screen: screenName,
                });
            }
        };
        window.transparenciaLogEvent = function (name, paramsJson) {
            if (typeof gtag !== "function" || !name) return;
            var params = {};
            try {
                if (paramsJson) params = JSON.parse(paramsJson);
            } catch (e) { /* ignore */ }
            gtag("event", name, params);
        };
        window.transparenciaCacheSave = function (key, value) {
            try { localStorage.setItem("tc_" + key, value); } catch (e) { /* ignore */ }
        };
        window.transparenciaCacheLoad = function (key) {
            try { return localStorage.getItem("tc_" + key); } catch (e) { return null; }
        };
        window.addEventListener("popstate", function () {
            if (typeof transparenciaHistoryPop === "function") transparenciaHistoryPop();
        });
    </script>
</head>
<body>
    <div id="app-loading" role="status" aria-live="polite">
        <div class="loader-card">
            <div class="loader-spinner" aria-hidden="true"></div>
            <p class="loader-title">Transparência Canindé</p>
            <p class="loader-subtitle">Carregando dados públicos…</p>
            <p class="loader-hint">Prefeitura e Câmara Municipal de Canindé/CE</p>
        </div>
    </div>
    <div id="ComposeTarget"></div>
    <script src="transparencia-caninde.js"></script>
</body>
</html>
