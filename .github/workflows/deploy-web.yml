# Publica o site Compose (webApp) na branch gh-pages → GitHub Pages.
# Ative em: Settings → Pages → Deploy from branch → gh-pages / (root)
# URL: https://jordilucas.github.io/transparencia_caninde/

name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'kmp-app/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build site (Kotlin/JS)
        working-directory: kmp-app
        run: ./gradlew :webApp:jsBrowserDistribution --no-daemon

      - name: Prepare GitHub Pages artifact
        working-directory: kmp-app/webApp/build/dist/js/productionExecutable
        run: |
          cp index.html 404.html
          touch .nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: kmp-app/webApp/build/dist/js/productionExecutable
          publish_branch: gh-pages
