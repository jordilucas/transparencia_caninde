# Publica o site Compose (webApp) na branch gh-pages → GitHub Pages.
# URL: https://transparenciacaninde.com.br/

name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'kmp-app/**'
      - '.github/workflows/deploy-web.yml'
      - '.github/workflows/fix-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build site (Kotlin/Wasm)
        working-directory: kmp-app
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon

      - name: Prepare GitHub Pages artifact
        working-directory: kmp-app/webApp/build/dist/wasmJs/productionExecutable
        run: |
          cp index.html 404.html
          touch .nojekyll
          test -f CNAME || echo "transparenciacaninde.com.br" > CNAME
          HASH=$(sha256sum transparencia-caninde.js | cut -c1-12)
          sed -i "s|transparencia-caninde.js|transparencia-caninde.js?v=${HASH}|g" index.html 404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: kmp-app/webApp/build/dist/wasmJs/productionExecutable
          publish_branch: gh-pages
          force_orphan: true

      - name: Configure Pages (custom domain)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CUSTOM_DOMAIN: transparenciacaninde.com.br
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${REPO}/pages"
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          PAYLOAD=$(printf '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"},"cname":"%s","https_enforced":true}' "$CUSTOM_DOMAIN")

          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "${AUTH[@]}" "$API")
          if [ "$STATUS" = "404" ]; then
            curl -sS -f -X POST "${AUTH[@]}" "$API" -d "$PAYLOAD"
          else
            curl -sS -f -X PATCH "${AUTH[@]}" "$API" -d "$PAYLOAD"
          fi
          echo "Pages configurado: gh-pages + https://${CUSTOM_DOMAIN}/"
