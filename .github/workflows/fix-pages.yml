# Corrige GitHub Pages: remove domínio customizado errado e aponta para gh-pages.
# Rode manualmente se github.io redirecionar para outro domínio (ex. mercadinhosantos.me).

name: Fix GitHub Pages config

on:
  workflow_dispatch:

permissions:
  pages: write
  administration: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages (gh-pages, sem custom domain)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${REPO}/pages"
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          echo "→ Consultando configuração atual…"
          STATUS=$(curl -sS -o /tmp/pages.json -w "%{http_code}" "${AUTH[@]}" "$API" || true)
          echo "   GET /pages → HTTP ${STATUS}"
          if [ "$STATUS" = "200" ]; then
            cat /tmp/pages.json
            echo ""
          fi

          PAYLOAD='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"},"cname":null,"https_enforced":true}'

          if [ "$STATUS" = "404" ]; then
            echo "→ Pages não existia; criando…"
            curl -sS -f -X POST "${AUTH[@]}" "$API" -d "$PAYLOAD" | tee /tmp/pages-result.json
          else
            echo "→ Atualizando (remove custom domain + branch gh-pages)…"
            curl -sS -f -X PATCH "${AUTH[@]}" "$API" -d "$PAYLOAD" | tee /tmp/pages-result.json
          fi

          echo ""
          echo "→ Verificando…"
          curl -sS "${AUTH[@]}" "$API" | tee /tmp/pages-after.json
          CNAME=$(python3 -c "import json; print(json.load(open('/tmp/pages-after.json')).get('cname'))")
          echo ""
          if [ "$CNAME" = "None" ] || [ -z "$CNAME" ]; then
            echo "✅ Custom domain removido. Teste: https://jordilucas.github.io/transparencia_caninde/"
          else
            echo "⚠️  cname ainda definido: ${CNAME}"
            echo "   Remova manualmente em Settings → Pages → Custom domain"
            exit 1
          fi
